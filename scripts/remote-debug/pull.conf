# 通用配置：远程开发机地址与各端同步路径。
#
# 本文件随仓库提交，默认值是仓库维护者的环境。想覆盖但不提交自己的配置，
# 建同目录的 `pull.conf.local`（已被 .gitignore 的 `*.local` 覆盖），内容同格式，
# 同名键会覆盖这里。优先级：命令行参数 / 环境变量 > pull.conf.local > pull.conf > 脚本内置默认。
#
# Python 同步脚本使用的配置键：
#   REMOTE     远程开发机地址（user@host）
#   REMOTE_DIR / LOCAL_DIR   按端区分，见下方分组
#   INTERVAL   轮询间隔秒数
#   SSH_KEY    私钥路径（可选；不配则使用 SSH agent / 默认密钥）
#   SSH_PORT   SSH 端口（默认 22）
#   SSH_CMD    ssh 命令（可选；默认 ssh）
#
# 写法约定：
#   - LOCAL_DIR 可用 $HOME 或 ~/，脚本负责展开
#   - REMOTE_DIR 是远端 Linux 路径，开头的 ~ 由远端 shell 展开
#   - 支持行内注释，但必须用 `  #`（两个空格 + 井号），否则会被当成路径的一部分
#   - 值里的引号会被剥掉，`"带空格的路径"` 可写
#
# 同步调用系统 rsync 命令；请安装 rsync 与 OpenSSH，并确保 rsync、ssh 在 PATH 中。

REMOTE=jacobi@192.168.100.100

# mp-weixin（微信开发者工具导入）
MP_REMOTE_DIR=~/Code/zukan/dist/dev/mp-weixin
MP_LOCAL_DIR=$HOME/zukan-mp-weixin

# app（App 离线 SDK 原生工程资源）
APP_REMOTE_DIR=~/Code/zukan/dist/build/app
APP_LOCAL_DIR=$HOME/zukan-app

INTERVAL=1
